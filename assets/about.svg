<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%">
  <style>
    .text-p { fill: #e4e4e4; } .text-s { fill: #888; } .text-a1 { fill: #6C63FF; }
    .fill-grad { fill: url(#aboutGrad); }
    @media (prefers-color-scheme: light) {
      .text-p { fill: #1f1f1f; } .text-s { fill: #666; }
    }
  </style>
  <text x="40" y="40" font-family="system-ui,sans-serif" font-size="24" font-weight="600" class="text-p">Mobile apps built to ship — and keep shipping.</text>
  <text x="40" y="72" font-family="system-ui,sans-serif" font-size="14" class="text-s">
    <tspan x="40" dy="0">4+ years designing and deploying Android &amp; iOS apps using Kotlin, Jetpack Compose, and modern</tspan>
    <tspan x="40" dy="22">architectural patterns. I turn complex technical requirements into maintainable mobile systems</tspan>
    <tspan x="40" dy="22">that perform well in production and remain easy for teams to extend.</tspan>
  </text>
  <g>
    <rect x="40" y="140" width="0" height="3" rx="1.5" fill="url(#aboutGrad)">
      <animate attributeName="width" values="0;920" dur="2s" fill="freeze"/>
    </rect>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12" class="text-s">
    <text x="40" y="175"><tspan fill="#6C63FF" font-weight="600">Based</tspan>  ·  India</text>
    <text x="220" y="175"><tspan fill="#6C63FF" font-weight="600">Experience</tspan>  ·  4+ years</text>
    <text x="440" y="175"><tspan fill="#6C63FF" font-weight="600">Platforms</tspan>  ·  Android, iOS</text>
    <text x="660" y="175"><tspan fill="#6C63FF" font-weight="600">Focus</tspan>  ·  Architecture, IoT, offline-first</text>
  </g>
</svg>