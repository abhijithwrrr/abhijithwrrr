<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%">
  <style>
    .card-bg { fill: #1a1a2e; opacity: 0.4; } .stroke { stroke: #2a2a2a; }
    .text-p { fill: #e4e4e4; } .text-s { fill: #888; } .text-m { fill: #555; }
    .text-a1 { fill: #6C63FF; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #f0f0f6; opacity: 0.6; }
      .stroke { stroke: #d8d8e0; } .text-p { fill: #1f1f1f; }
      .text-s { fill: #666; } .text-m { fill: #999; }
    }
  </style>
  <rect x="20" y="10" width="310" height="130" rx="12" class="card-bg"/>
  <rect x="20" y="10" width="310" height="130" rx="12" fill="none" class="stroke" stroke-width="1">
    <animate attributeName="stroke" values="#2a2a2a;#6C63FF;#2a2a2a" dur="4s" repeatCount="indefinite"/></rect>
  <text x="40" y="42" class="text-m" font-family="monospace" font-size="11">2019 — 2022</text>
  <text x="40" y="68" class="text-p" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Bachelor of Computer Applications</text>
  <text x="40" y="92" class="text-s" font-family="system-ui,sans-serif" font-size="12">Bharathiar University</text>

  <rect x="350" y="10" width="310" height="130" rx="12" class="card-bg"/>
  <rect x="350" y="10" width="310" height="130" rx="12" fill="none" class="stroke" stroke-width="1">
    <animate attributeName="stroke" values="#2a2a2a;#FF6584;#2a2a2a" dur="4s" repeatCount="indefinite" begin="1s"/></rect>
  <text x="370" y="42" class="text-m" font-family="monospace" font-size="11">2018 — 2020</text>
  <text x="370" y="68" class="text-p" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Bachelor of Arts in English</text>
  <text x="370" y="92" class="text-s" font-family="system-ui,sans-serif" font-size="12">Rabindranath Tagore University</text>

  <rect x="680" y="10" width="300" height="130" rx="12" class="card-bg"/>
  <rect x="680" y="10" width="300" height="130" rx="12" fill="none" class="stroke" stroke-width="1"/>
  <text x="700" y="38" class="text-a1" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Certifications</text>
  <text x="700" y="65" class="text-p" font-family="system-ui,sans-serif" font-size="12">Android Dev (Kotlin) — Internshala</text>
  <text x="700" y="88" class="text-p" font-family="system-ui,sans-serif" font-size="12">Android 12 + Kotlin — Udemy</text>
  <text x="700" y="111" class="text-p" font-family="system-ui,sans-serif" font-size="12">Flutter Dev Bootcamp — Udemy</text>
</svg>