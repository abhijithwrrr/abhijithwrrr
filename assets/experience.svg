<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%">
  <style>
    .text-p { fill: #e4e4e4; } .text-s { fill: #888; } .text-m { fill: #555; }
    .text-green { fill: #22C55E; } .timeline { stroke: #2a2a2a; }
    @media (prefers-color-scheme: light) {
      .text-p { fill: #1f1f1f; } .text-s { fill: #666; } .text-m { fill: #999; }
      .timeline { stroke: #d8d8e0; }
    }
  </style>
  <rect x="32" y="20" width="2" height="180" rx="1" class="timeline"/>
  <rect x="32" y="20" width="2" height="0" rx="1" fill="url(#expGrad)">
    <animate attributeName="height" values="0;180" dur="2s" fill="freeze"/></rect>

  <circle cx="33" cy="40" r="5" fill="#6C63FF">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle>
  <text x="60" y="35" class="text-m" font-family="system-ui,sans-serif" font-size="11">Nov 2025 — Present</text>
  <rect x="60" y="48" width="75" height="20" rx="10" fill="#22C55E" opacity="0.15"/>
  <text x="75" y="62" font-family="system-ui,sans-serif" font-size="11" fill="#22C55E">Current</text>
  <text x="155" y="46" class="text-p" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Mobile App Developer</text>
  <text x="155" y="66" class="text-s" font-family="system-ui,sans-serif" font-size="13">Digitide Solutions Ltd.</text>

  <circle cx="33" cy="105" r="4" fill="#FF6584">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="0.5s"/></circle>
  <text x="60" y="100" class="text-m" font-family="system-ui,sans-serif" font-size="11">Jun 2022 — Nov 2025</text>
  <text x="155" y="111" class="text-p" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Android App Developer</text>
  <text x="155" y="131" class="text-s" font-family="system-ui,sans-serif" font-size="13">Primemover Solutions Pvt Ltd. · Coimbatore</text>

  <circle cx="33" cy="190" r="4" fill="#6C63FF"/>
  <text x="60" y="185" class="text-m" font-family="system-ui,sans-serif" font-size="11">Sep 2021 — Nov 2021</text>
  <text x="155" y="196" class="text-p" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Data Annotator for AI</text>
  <text x="155" y="216" class="text-s" font-family="system-ui,sans-serif" font-size="13">Digiyoda Media Pvt Ltd. · Parkel, Telangana</text>
</svg>