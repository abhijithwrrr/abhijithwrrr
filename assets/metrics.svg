<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%">
  <style>
    .card-bg { fill: #1a1a2e; opacity: 0.4; } .text-p { fill: #e4e4e4; }
    .text-s { fill: #888; } .text-a1 { fill: #6C63FF; } .text-a2 { fill: #FF6584; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #f0f0f6; opacity: 0.6; }
      .text-p { fill: #1f1f1f; } .text-s { fill: #666; }
    }
  </style>

  <rect x="15" y="15" width="235" height="90" rx="10" class="card-bg"/>
  <text x="40" y="65" font-family="system-ui,sans-serif" font-size="32" font-weight="700" class="text-p">
    4<animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/></text>
  <text x="75" y="65" font-family="system-ui,sans-serif" font-size="18" font-weight="600" class="text-a1">+</text>
  <text x="40" y="90" class="text-s" font-family="system-ui,sans-serif" font-size="12">Years building mobile products</text>

  <rect x="260" y="15" width="235" height="90" rx="10" class="card-bg"/>
  <text x="285" y="65" font-family="system-ui,sans-serif" font-size="32" font-weight="700" class="text-p">
    25<animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/></text>
  <text x="330" y="65" font-family="system-ui,sans-serif" font-size="18" font-weight="600" class="text-a2">%</text>
  <text x="285" y="90" class="text-s" font-family="system-ui,sans-serif" font-size="12">Network latency cut on API flows</text>

  <rect x="505" y="15" width="235" height="90" rx="10" class="card-bg"/>
  <text x="530" y="65" font-family="system-ui,sans-serif" font-size="32" font-weight="700" class="text-p">
    50<animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/></text>
  <text x="578" y="65" font-family="system-ui,sans-serif" font-size="18" font-weight="600" class="text-a1">%+</text>
  <text x="530" y="90" class="text-s" font-family="system-ui,sans-serif" font-size="12">ANR drop via lifecycle &amp; death fixes</text>

  <rect x="750" y="15" width="235" height="90" rx="10" class="card-bg"/>
  <text x="775" y="65" font-family="system-ui,sans-serif" font-size="32" font-weight="700" class="text-p">
    60<animate attributeName="opacity" values="0;1" dur="1s" begin="0.9s" fill="freeze"/></text>
  <text x="820" y="65" font-family="system-ui,sans-serif" font-size="18" font-weight="600" class="text-a2">+</text>
  <text x="775" y="90" class="text-s" font-family="system-ui,sans-serif" font-size="12">Locales supported across shipped apps</text>
</svg>